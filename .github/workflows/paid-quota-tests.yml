name: Paid Board Sense quota policy tests
on:
  push:
    branches: [feature/signal-day-paid-usage-guard]
    paths:
      - 'routes/paid_usage_policy.py'
      - 'tests/test_paid_usage_policy.py'
      - '.github/workflows/paid-quota-tests.yml'
  pull_request:
    paths:
      - 'routes/paid_usage_policy.py'
      - 'tests/test_paid_usage_policy.py'
permissions:
  contents: read
jobs:
  offline-paid-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input 'pytest==8.4.2'
      - name: Test policy without service secrets
        run: python -m pytest -q tests/test_paid_usage_policy.py
