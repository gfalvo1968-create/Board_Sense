name: Offline launch quota rehearsal

on:
  push:
    branches:
      - feature/phase-7d-phone-family-evidence
    paths:
      - 'routes/free_usage_gate.py'
      - 'routes/origin_security.py'
      - 'tests/test_launch_quota_concurrency.py'
      - '.github/workflows/offline-launch-quota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'pytest==8.4.2' 'fastapi==0.142.2' 'starlette==1.7.0'
      - name: Run offline quota tests (no secrets or requests to live services)
        env:
          BOARD_SENSE_ENV: development
          BOARD_SENSE_TESTER_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          SUPABASE_SECRET_KEY: ''
        run: python -m pytest -q tests/test_launch_quota_concurrency.py
