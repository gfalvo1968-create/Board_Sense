name: PCB object-gate and grade regression checks
on:
  push:
    branches:
      - fix/pcb-dark-laptop-review-20261113
  pull_request:
    paths:
      - 'routes/object_gate.py'
      - 'routes/recovery_grade_guard.py'
      - 'tests/test_object_gate_framing.py'
      - 'tests/test_grade_review.py'
      - 'routes/board_blueprint.py'
      - 'routes/board_analyzer.py'
      - 'main.py'
      - 'index.html'
      - 'routes/free_usage_gate.py'
      - 'routes/upload_security.py'
      - 'tests/test_private_api_responses.py'
      - 'tests/test_generated_artifact_privacy.py'
      - 'single_board_handoff.js'
      - 'tests/test_single_board_handoff.js'
      - 'scripts/staging_http_security_check.py'
      - '.github/workflows/pcb-guard-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify in-page JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          inline = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/board-sense-dashboard.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/board-sense-dashboard.js
          node --check single_board_handoff.js
          node tests/test_single_board_handoff.js
      - name: Run PCB recognition and grade regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Anonymous staging HTTP security checks (read-only)
        run: python scripts/staging_http_security_check.py
