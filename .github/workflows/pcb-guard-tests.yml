name: PCB object-gate and grade regression checks
on:
  push:
    branches:
      - fix/pcb-dark-laptop-review-20261113
  pull_request:
    paths:
      - 'routes/object_gate.py'
      - 'routes/recovery_grade_guard.py'
      - 'tests/test_object_gate_framing.py'
      - 'tests/test_grade_review.py'
      - '.github/workflows/pcb-guard-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run PCB recognition and grade regressions
        run: python -m unittest tests.test_object_gate_framing tests.test_grade_review -v
