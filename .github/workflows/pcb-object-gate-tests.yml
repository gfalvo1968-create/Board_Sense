name: SPIKE PCB gate regression (draft repair)
on:
  push:
    branches:
      - fix/dark-irregular-pcb-object-gate
  workflow_dispatch:

jobs:
  pcb-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q routes tests main.py
      - name: Run object-gate and adjacent regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
