<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Board Sense Harbor Edition v0.7</title>

    <link rel="stylesheet" href="Static/Style_v07.css">
</head>

<body>

    <div id="app">

        <header id="header">
    <h1>🧠 Board Sense</h1>
    <p>⚓ Harbor Edition v0.7 | Clean Build</p>
 </header>

        <main id="content">

<section id="harbor-elevator" class="panel">
    <h2>🛗 Harbor Elevator</h2>
    <div class="button-row">
        <button id="dashboardBtn">Dashboard</button>
        <button id="scanBtn">Scan Board</button>
             <button id="recoveryBtn">Recovery</button>
        <button id="knowledgeBtn">Knowledge</button>
        <button id="spyglassBtn">Spyglass</button>
    </div>
</section>

<section id="scan-board" class="panel">
    <h2>📷 Scan Board</h2>

    <input type="file" id="boardImage" accept="image/*">

    <button id="analyzeBtn">Analyze Board</button>

    <div id="uploadStatus">
        Waiting for board image...
    </div>
</section>

<section id="investigation-report" class="panel">
    <h2>📊 Investigation Report</h2>

    <div id="predictionBox">
        No analysis yet.
    </div>
</section>

<section id="developer-console" class="panel">
    <h2>⚙️ Harbor Developer Console</h2>

    <div id="dev-console">
        Harbor initialized...
    </div>
</section>

</main>

    </div>

    <script src="Static/app.js"></script>

</body>
</html>
